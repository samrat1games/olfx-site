<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="OLFX — скоро.">
  <title>OLFX — скоро</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: #09090d; color: #f5f3ff; display: grid; place-items: center; overflow-x: hidden; }
    body::before { content: ""; position: fixed; width: min(80vw, 680px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #7a4bdb24, transparent 67%); pointer-events: none; }
    main { position: relative; text-align: center; padding: 48px 24px; }
    .status { display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px; border: 1px solid #ffffff1c; border-radius: 100px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #c5b7e3; }
    .dot { width: 6px; height: 6px; background: #b99aff; border-radius: 50%; box-shadow: 0 0 12px #b99aff88; }
    h1 { margin: 32px 0 10px; font-size: clamp(80px, 21vw, 176px); font-weight: 850; line-height: .95; letter-spacing: -.075em; padding-right: .075em; }
    p { margin: 24px 0 0; font-size: clamp(22px, 4vw, 36px); font-weight: 400; color: #c5b7e3; letter-spacing: .05em; }
    footer { position: fixed; bottom: 26px; left: 20px; right: 20px; text-align: center; font-size: 11px; letter-spacing: .16em; color: #6b6678; }
  </style>
</head>
<body>
  <main aria-label="OLFX — скоро">
    <span class="status"><span class="dot" aria-hidden="true"></span>В разработке</span>
    <h1>OLFX</h1>
    <p>Скоро.</p>
  </main>
  <footer>OLFX</footer>
</body>
</html>
